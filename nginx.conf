# STILLSTANCE — static PWA server.
# TLS is intentionally NOT handled here; terminate HTTPS at your reverse proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The app makes zero external requests, so the CSP can
    # be maximally strict without breaking anything.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed build assets are immutable.
    # (expires is used instead of add_header so the security headers above stay inherited.)
    location /assets/ {
        expires 1y;
    }

    # The service worker and entry point must always revalidate so updates propagate.
    location = /sw.js {
        expires -1;
    }
    location = /index.html {
        expires -1;
    }
    location = /manifest.webmanifest {
        expires -1;
        types { } default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
    }
}
