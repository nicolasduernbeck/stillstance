services:
  stillstance:
    build: .
    image: stillstance:latest
    container_name: stillstance
    restart: unless-stopped
    ports:
      # Change the left side (or set PORT) to serve on a different host port.
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Optional hardening: static content needs no writable root filesystem.
    read_only: true
    tmpfs:
      - /tmp
